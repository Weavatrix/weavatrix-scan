[package]
name = "weavatrix-scan"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "Deterministic, safe repository scanner for code intelligence"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/weavatrix-scan"
documentation = "https://docs.rs/weavatrix-scan"
readme = "README.md"
keywords = ["repository", "scanner", "gitignore", "static-analysis", "code-intelligence"]
categories = ["development-tools", "filesystem"]

[dependencies]
notify = { version = "8.2.0", optional = true }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[target.'cfg(windows)'.dependencies]
# Safe file/volume/stdout identity while the equivalent std APIs remain
# unstable on the Rust 1.88 MSRV. This keeps crate code unsafe-free.
winapi-util = "0.1.11"

[dev-dependencies]
ignore = "0.4.31"
jwalk = "0.8.1"
serde_json = "1.0.151"
walkdir = "2.5.0"

[features]
default = []
notify = ["dep:notify"]
rayon = ["dep:rayon"]
serde = ["dep:serde"]

[[bench]]
name = "scan_repository"
harness = false

[[bench]]
name = "compare_competitors"
harness = false

[[bench]]
name = "real_repository"
harness = false

[[bench]]
name = "stress_profiles"
harness = false

[[bench]]
name = "p2_apis"
harness = false

[[bench]]
name = "scale_large"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
