[package]
name = "weavatrix-scan-node"
version = "0.4.7"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.2", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = "3.6.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
weavatrix-scan = { path = "..", features = ["serde"] }

[build-dependencies]
napi-build = "2.2.4"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
