name: Publish weavatrix-md

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    name: crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sergii-ziborov/weavatrix-md
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || { echo "CARGO_REGISTRY_TOKEN missing" >&2; exit 1; }
          cargo publish --locked --no-verify

  npm:
    name: npm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sergii-ziborov/weavatrix-md
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build release binary
        run: cargo build --release --locked
      - name: Assemble npm package
        run: node scripts/build-npm-packages.mjs current win32-x64 target/release/weavatrix-md.exe 0.1.0
      - name: Publish npm package
        working-directory: npm/dist/weavatrix-md
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if (-not $env:NODE_AUTH_TOKEN) { throw "NPM_TOKEN missing" }
          npm publish --access public --ignore-scripts
