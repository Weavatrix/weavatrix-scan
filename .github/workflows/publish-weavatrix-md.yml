name: Publish weavatrix-md

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: npm
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sergii-ziborov/weavatrix-md
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build release binary
        run: cargo build --release --locked
      - name: Assemble npm package
        run: node scripts/build-npm-packages.mjs current win32-x64 target/release/weavatrix-md.exe 0.1.0
      - name: Publish npm package
        working-directory: npm/dist/weavatrix-md
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if (-not $env:NODE_AUTH_TOKEN) { throw "NPM_TOKEN missing" }
          npm config set provenance true
          npm publish --access public --ignore-scripts --provenance
