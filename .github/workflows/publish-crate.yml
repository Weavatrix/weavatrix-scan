name: Publish crate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      yank_version:
        description: Optional broken version to yank after a successful replacement publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Verify release tag matches the crate version
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "Run this workflow from tag v$VERSION" >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo "Tag $GITHUB_REF_NAME does not match crate version $VERSION" >&2; exit 1; }
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo +stable test --all-features --locked
      - name: Verify package
        run: cargo +stable publish --locked --dry-run
      - name: Authenticate with crates.io trusted publishing
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo +stable publish --locked --no-verify
      - name: Yank superseded broken version
        if: github.event_name == 'workflow_dispatch' && inputs.yank_version != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable yank --vers "${{ inputs.yank_version }}"
